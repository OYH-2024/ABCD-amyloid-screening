<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Target Proteins | Amyloid Binding Compounds Database (ABCDDB)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2a5298;
            --secondary-color: #1e3c72;
            --accent-color: #00bcd4;
            --light-bg: #f8f9fa;
            --dark-text: #333;
            --light-text: #fff;
            --border-radius: 8px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Navigation bar */
        .navbar-custom {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            box-shadow: var(--box-shadow);
            padding: 0.8rem 1rem;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--light-text);
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            margin-right: 10px;
        }

        .nav-link-custom {
            color: rgba(255, 255, 255, 0.9);
            padding: 0.8rem 1.2rem;
            margin: 0 0.3rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
            display: flex;
            align-items: center;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--light-text);
        }

        /* Header section */
        .header-section {
            background: linear-gradient(rgba(30, 60, 114, 0.9), rgba(42, 82, 152, 0.95)),
            url('https://via.placeholder.com/1200x300/1e3c72/ffffff?text=Target+Protein+Gallery') center/cover;
            color: var(--light-text);
            padding: 4rem 0 3rem;
            text-align: center;
            position: relative;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            background: var(--light-text);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            overflow: hidden;
        }

        .grid-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        }

        .grid-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .grid-item div {
            padding: 14px;
            text-align: center;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .grid-item a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
